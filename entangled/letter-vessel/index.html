<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Letter Vessel · Entangled Shelter</title>
<style>
html{color-scheme:dark;background:transparent}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:#f4e6c9;font:16px Georgia,serif}
main{max-width:1320px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(205px,.75fr) minmax(0,1.65fr);gap:clamp(12px,3vw,46px);align-items:center;min-height:100vh}
header{border-top:1px solid #b89761;padding-top:18px}
h1{font-weight:400;font-size:clamp(40px,6vw,86px);line-height:.98;margin:12px 0 20px}
small{color:#e5c487;text-transform:uppercase;letter-spacing:.13em}
p{line-height:1.48}
button{background:#192d23;color:inherit;border:1px solid #b3965f;padding:9px 14px;font:inherit;cursor:pointer}
button:focus-visible,canvas:focus-visible,.examiner:focus-visible{outline:2px solid #e5c88c;outline-offset:3px}
canvas{width:100%;aspect-ratio:1;touch-action:none;cursor:grab;display:block}
canvas:active{cursor:grabbing}
.buttons{display:flex;gap:8px;flex-wrap:wrap}
#result{margin-top:12px}
#result h2{font-size:1.15rem;margin:0 0 8px;font-weight:400}
[hidden]{display:none!important}
#status{color:#e1ca9f;min-height:48px}
@media(max-width:650px){main{display:flex;flex-direction:column;padding:40px 4px 24px;gap:14px;min-height:auto;align-items:stretch}h1{font-size:clamp(38px,9vw,58px)}.vessel-stage{width:min(100%,580px);margin:auto}#status{min-height:0}}
.vessel-stage{position:relative;min-width:0;width:min(100%,calc(100vh - 48px));justify-self:center}
.examiner{position:absolute;inset:0;display:grid;place-items:center;perspective:780px;background:radial-gradient(ellipse,#1d120be0 0%,#1d120b70 55%,transparent 75%);touch-action:none;cursor:grab}
.examiner:active{cursor:grabbing}
.envelope-model{width:63%;aspect-ratio:1.53;position:relative;transform-style:preserve-3d;transform:translateZ(45px) rotateX(var(--rx,8deg)) rotateY(var(--ry,-12deg));transition:transform .22s ease-out}
.examiner[data-dragging=true] .envelope-model{transition:none}
@media(prefers-reduced-motion:no-preference){
 .examiner[data-open=false][data-dragging=false] .envelope-model{animation:letterHover 4.8s ease-in-out infinite}
}
@keyframes letterHover{0%,100%{translate:0 -3px}50%{translate:0 -16px}}
.face,.paper-edge{position:absolute;display:block}
.face{inset:0;border-radius:2%;backface-visibility:hidden;box-shadow:0 18px 38px #04080490}
.face-front{transform:translateZ(4px);background:url(envelope-photo.webp) center/100% 100% no-repeat;overflow:hidden}
.face-front::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at var(--lx,50%) var(--ly,40%),#fff6d659,transparent 65%);mix-blend-mode:screen}
.face-back{transform:rotateY(180deg) translateZ(4px);background:linear-gradient(140deg,#eaddb9,#c4a573);border:1px solid #c3a378;color:#51442e;display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 19px #6b472a55}
.face-back i{border:1px solid #84663f;padding:4px 13px;font-size:clamp(12px,2vw,20px)}
.paper-edge{width:8px;height:97%;top:1.5%;background:linear-gradient(90deg,#8f734d,#d8c498,#ac8d5d)}
.paper-edge.left{left:-4px;transform:rotateY(-90deg)}
.paper-edge.right{right:-4px;transform:rotateY(90deg)}
.view-hint{position:absolute;bottom:11%;margin:0;color:#e6cb94;font-size:.86rem;pointer-events:none;text-shadow:0 1px 5px #000}
@media(prefers-reduced-motion:reduce){.envelope-model{transition:none}}

.open-pocket,.open-flap,.letter-note{display:none;position:absolute}
.examiner[data-open=true] .face-front{overflow:visible;background:#d4b382}
.examiner[data-open=true] .face-front::after{display:none}
.examiner[data-open=true] .open-pocket,.examiner[data-open=true] .open-flap,.examiner[data-open=true] .letter-note{display:block}
.open-pocket{inset:0;z-index:3;background:url(envelope-photo.webp) center/100% 100%;clip-path:polygon(0 45%,50% 73%,100% 45%,100% 100%,0 100%)}
.open-flap{inset:0;z-index:1;background:linear-gradient(155deg,#e9d5ae,#b8996c);clip-path:polygon(0 0,100% 0,50% 64%);transform-origin:top center;animation:liftFlap .45s ease-out both}
.letter-note{z-index:2;inset:9% 8% 0;background:url(aged-letter-paper.webp) center / 100% 100% no-repeat;filter:drop-shadow(0 4px 5px #20140859);place-items:center;text-align:center;padding:7% 9%;color:#263d2b;font-size:clamp(17px,3vw,34px);animation:slideNote .5s .32s ease-out both}
.examiner[data-open=true] .letter-note{display:grid}
@keyframes liftFlap{to{transform:rotateX(168deg)}}
@keyframes slideNote{from{transform:translateY(0);opacity:0}to{transform:translateY(-64%);opacity:1}}
@media(prefers-reduced-motion:reduce){.open-flap,.letter-note{animation-delay:0s;animation-duration:1ms}}
</style>
<main>
<header><small>The Ritual</small><h1>The Letter Vessel</h1><p>Stir the pile. Tap a letter to lift it, or drag one away from the pile.</p>
<div class="buttons"><button id="stir">Stir the letters</button><button id="draw">Draw a letter</button><button id="reset" hidden>Refill the vessel</button></div>
<p id="status" role="status">108 sealed letters across Taste, Style and Wander.</p>
<section id="result" hidden><h2 id="reveal">A sealed letter</h2><button id="return">Put it back</button> <button id="next" hidden>Draw again</button></section>
</header>
<div class="vessel-stage"><canvas id="vessel" aria-label="Letter vessel. Drag to stir, or pull a letter away from the pile. Press Enter to draw." tabindex="0"></canvas>
<div class="examiner" id="examiner" tabindex="0" aria-label="Open drawn envelope. Drag or use the arrow keys to turn it." hidden>
  <div class="envelope-model" id="envelope-model" aria-hidden="true">
    <div class="face face-front"><div class="open-pocket"></div><div class="open-flap"></div><div class="letter-note" id="letter-note"></div></div><div class="face face-back"><i>Private correspondence</i></div>
    <div class="paper-edge left"></div><div class="paper-edge right"></div>
  </div>
  <p class="view-hint">Click the letter to open it · Drag to turn</p>
</div></div>
</main>
<script>
const canvas=document.querySelector('#vessel'),ctx=canvas.getContext('2d');
const status=document.querySelector('#status'),result=document.querySelector('#result'),reveal=document.querySelector('#reveal');
const next=document.querySelector('#next');
const reset=document.querySelector('#reset'),draw=document.querySelector('#draw'),stir=document.querySelector('#stir'),putBack=document.querySelector('#return');
const envelopePhoto=new Image();
envelopePhoto.onload=()=>{
 for(let i=0;i<palette.length;i++){
  const texture=document.createElement('canvas');
  const height=Math.round(91*envelopePhoto.naturalHeight/envelopePhoto.naturalWidth);
  texture.width=111;texture.height=height+22;
  const paint=texture.getContext('2d');
  paint.filter=`brightness(${.83+i*.055})`;
  paint.shadowColor='#040806a0';paint.shadowBlur=7;paint.shadowOffsetY=4;
  paint.drawImage(envelopePhoto,10,10,91,height);
  paperTextures.push(texture);
 }
 render();
};
envelopePhoto.src='envelope-photo.webp';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const size=540,center=270,radius=220;
const ideas = {
 Taste: [
  'Miso ramen','Mushroom risotto','Street tacos','Tomato pasta','Steamed dumplings','Spiced lentils',
  'Margherita pizza','Chickpea salad','Vegetable curry','Roast aubergine','Grilled halloumi','Tomato toast',
  'Mushroom pie','Sweet potato soup','Falafel wrap','Kimchi fried rice','Spinach gnocchi','Breakfast for dinner',
  'Sesame noodles','Baked potatoes','Goat cheese tart','Black bean burrito','Lemon orzo','A picnic supper',
  'Coconut rice bowl','Greek salad','Corn chowder','Vegetable tempura','Pumpkin ravioli','Roasted cauliflower',
  'Spinach and feta pastry','White bean stew','Soba with greens','Cheese and onion toastie','Mushroom flatbread','Ginger tofu',
 ],
 Style: [
  'Try a monochrome look','Pair denim with a white tee','Wear soft neutrals','Start with a linen shirt',
  'Build around a favourite jacket','Add a silk scarf','Mix stripes and solids','Try an oversized knit',
  'Wear loafers with tailored trousers','Add one bright accessory','Try a belted coat','Layer a vest over a shirt',
  'Dress around your favourite shoes','Pair navy with cream','Wear your favourite vintage piece','Try brown and olive',
  'Pair a knit with wide-leg trousers','Wear a crisp white shirt','Try a tonal denim outfit','Build a look in black and gold',
  'Pair corduroy with a plain tee','Try a leather jacket','Wear a bright knit','Pair trainers with tailoring',
  'Pair a denim jacket with chinos','Try a checked blazer','Wear a long wool coat','Try a navy cardigan',
  'Pair pleats with a soft tee','Layer a turtleneck under a jacket','Style a trench coat','Try a canvas tote',
  'Pair chocolate brown with cream','Add a patterned belt','Try a scarf in a contrasting colour','Wear a relaxed suit',
 ],
 Wander: [
  'Take a woodland walk','Visit a small gallery','Explore an old town','Spend an hour by the river',
  'Browse a second-hand bookshop','Walk through a botanical garden','Take a train to a nearby town','Follow a seaside path',
  'Visit a local market','Take your camera on a short walk','Find a hilltop viewpoint','Explore a neighbourhood park',
  'Visit a small museum','Pack a picnic for the park','Follow a canal towpath','Watch the sunset somewhere new',
  'Visit a historic house','Walk around a lake','Take the scenic route home','Explore a quiet village',
  'Find a sunrise viewpoint','Spend an afternoon at a library','Explore the city by tram','Visit a weekend craft market',
  'Visit an independent cinema','Explore a sculpture park','Take a ferry across the river','Walk to a waterfront café',
  'Find a public garden','Visit a photography exhibition','Take a cycle path out of town','Walk a stretch of coastline',
  'Explore a covered market','Follow a street art trail','Visit a local observatory','Take a day trip by bus',
 ],
};
const options = Object.entries(ideas).flatMap(([theme, entries]) => entries.map(idea => ({theme, idea})));
const palette=['#e7d2a5','#d9be8a','#efdfb6','#b9ac8d','#d4c1a0'];
const paperTextures=[];
let letters=[],gesture=null,selected=null,frame=0,energy=0;
const floatingCount=24;
const pileCache=document.createElement('canvas');
const pilePaint=pileCache.getContext('2d');
let pileCacheDirty=true;
let lastHoverFrame=0, hoverFrame=0;
const hover={x:0,y:0,strength:0};
let hoverTarget=null;
const examiner=document.querySelector('#examiner'), model=document.querySelector('#envelope-model');
let turn=-12, tilt=8, rotation=null, opened=false;
const note=document.querySelector('#letter-note');
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function orient(yaw=turn,pitch=tilt){
 model.style.setProperty('--ry',yaw+'deg');model.style.setProperty('--rx',pitch+'deg');
}
function showExaminer(){
 turn=-12;tilt=8;rotation=null;examiner.dataset.dragging='false';
 opened=false;examiner.dataset.open='false';examiner.querySelector('.view-hint').textContent='Click the letter to open it · Drag to turn';
 orient();examiner.hidden=false;
}
examiner.addEventListener('pointerdown',e=>{
 if(opened||!e.isPrimary||e.button!==0)return;
 rotation={id:e.pointerId,x:e.clientX,y:e.clientY,yaw:turn,pitch:tilt};
 examiner.dataset.dragging='true';examiner.setPointerCapture(e.pointerId);
});
examiner.addEventListener('pointermove',e=>{
 if(opened)return;
 const b=examiner.getBoundingClientRect(),x=clamp((e.clientX-b.left)/b.width,0,1),y=clamp((e.clientY-b.top)/b.height,0,1);
 model.style.setProperty('--lx',`${x*100}%`);model.style.setProperty('--ly',`${y*100}%`);
 if(rotation?.id===e.pointerId){
  turn=rotation.yaw+(e.clientX-rotation.x)*1.45;
  tilt=clamp(rotation.pitch-(e.clientY-rotation.y)*.36,-28,28);
  orient();
 }else if(!reduced&&e.pointerType==='mouse')orient(turn+(x-.5)*46,tilt-(y-.5)*32);
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])examiner.addEventListener(event,e=>{
 if(rotation?.id!==e.pointerId)return;
 const wasClick=event==='pointerup'&&Math.hypot(e.clientX-rotation.x,e.clientY-rotation.y)<6&&model.contains(document.elementFromPoint(e.clientX,e.clientY));
 rotation=null;examiner.dataset.dragging='false';
 if(wasClick)openLetter();
});
examiner.addEventListener('pointerleave',()=>{
 if(rotation)return;
 orient();
 model.style.removeProperty('--lx');
 model.style.removeProperty('--ly');
});
examiner.addEventListener('keydown',e=>{
 if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter();return}
 if(opened)return;
 const direction={ArrowLeft:-1,ArrowRight:1}[e.key];
 if(direction){e.preventDefault();turn+=direction*30;orient()}
});

const rand=(a,b)=>a+Math.random()*(b-a);
function refill(){
 const shuffled = [...options];
 for (let i = shuffled.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
 }
 letters = shuffled.map(({theme, idea}, i) => {
  const angle = rand(0, Math.PI * 2), distance = Math.sqrt(Math.random()) * 195;
  return {x:center + Math.cos(angle)*distance, y:center + Math.sin(angle)*distance, a:rand(-Math.PI,Math.PI),
   vx:0, vy:0, va:0, paper:palette[i%palette.length], answer:`${theme} · ${idea}`};
 });
 selected=null;gesture=null;result.hidden=true;examiner.hidden=true;reset.hidden=true;draw.disabled=false;status.textContent='108 sealed letters across Taste, Style and Wander.';render();
}
function pose(p,index){
 if(reduced || gesture || index<letters.length-floatingCount)return p;
 const dx=p.x-hover.x,dy=p.y-hover.y;
 const distance=Math.hypot(dx,dy);
 const push=hover.strength*Math.max(0,1-distance/135);
 const divisor=Math.max(24,distance);
 return {
  x:p.x+dx/divisor*push*27,
  y:p.y+dy/divisor*push*20-push*12,
  a:p.a+dx/divisor*push*.18,
 };
}
function envelope(p,lifted=false,position=p,paint=ctx){
 paint.save();paint.translate(position.x,position.y);paint.rotate(position.a);
 if(lifted)paint.scale(1.12,1.12);
 paint.shadowColor='#040806a0';paint.shadowBlur=lifted?18:0;paint.shadowOffsetY=lifted?10:0;
 if(envelopePhoto.naturalWidth){
  const paperHeight=91*envelopePhoto.naturalHeight/envelopePhoto.naturalWidth;
  const texture=paperTextures[palette.indexOf(p.paper)];
  if(texture&&!lifted)paint.drawImage(texture,-texture.width/2,1-texture.height/2);
  else paint.drawImage(envelopePhoto,-45.5,-paperHeight/2,91,paperHeight);
  paint.restore();
  return;
 }
 paint.fillStyle=p.paper;paint.fillRect(-44,-29,88,58);paint.shadowBlur=0;paint.shadowOffsetY=0;
 paint.strokeStyle='#8b6d46';paint.lineWidth=1;paint.strokeRect(-44,-29,88,58);
 paint.beginPath();paint.moveTo(-43,-28);paint.lineTo(0,6);paint.lineTo(43,-28);paint.fillStyle='#f4e1b42c';paint.fill();paint.stroke();
 paint.beginPath();paint.moveTo(-43,28);paint.lineTo(-16,1);paint.moveTo(43,28);paint.lineTo(16,1);paint.stroke();
 paint.beginPath();paint.arc(0,7,7,0,Math.PI*2);paint.fillStyle='#702f32';paint.fill();paint.strokeStyle='#ac6260';paint.stroke();paint.restore();
}
function render(ambient=false){
 ctx.clearRect(0,0,size,size);
 let start=0;
 if(ambient){
  start=Math.max(0,letters.length-floatingCount);
  if(pileCacheDirty){
   pilePaint.clearRect(0,0,size,size);
   for(let i=0;i<start;i++)envelope(letters[i],false,letters[i],pilePaint);
   pileCacheDirty=false;
  }
  ctx.drawImage(pileCache,0,0,size,size);
 }else{
  pileCacheDirty=true;
 }
 for(let i=start;i<letters.length;i++){
  const letter=letters[i];
  if(letter!==gesture?.letter)envelope(letter,false,pose(letter,i));
 }
 if(gesture?.letter)envelope(gesture.letter,true);
}
function movePile(){
 frame=0;energy*=.91;
 for(const p of letters){
  if(p===gesture?.letter)continue;
  p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.vx*=.88;p.vy*=.88;p.va*=.87;
  const dx=p.x-center,dy=p.y-center,d=Math.hypot(dx,dy);
  if(d>radius-23){p.x=center+dx*(radius-23)/d;p.y=center+dy*(radius-23)/d;p.vx*=.45;p.vy*=.45}
 }
 for(let i=0;i<letters.length;i++)for(let j=i+1;j<letters.length;j++){
  const a=letters[i],b=letters[j];if(a===gesture?.letter||b===gesture?.letter)continue;
  const x=b.x-a.x,y=b.y-a.y,d=Math.hypot(x,y);if(d>=27||d<.01)continue;
  const force=(27-d)*.065;a.vx-=x/d*force;a.vy-=y/d*force;b.vx+=x/d*force;b.vy+=y/d*force;
 }
 render();if(energy>.018)frame=requestAnimationFrame(movePile);
}
function wake(power=1){energy=Math.max(energy,power);if(reduced){movePile();cancelAnimationFrame(frame);frame=0}else if(!frame)frame=requestAnimationFrame(movePile)}
function mix(x,y,dx,dy){for(const p of letters){const d=Math.hypot(p.x-x,p.y-y);if(d>120)continue;const weight=(1-d/120)*.28;p.vx+=dx*weight;p.vy+=dy*weight;p.va+=(dx-dy)*weight*.018}wake()}
function point(event){const b=canvas.getBoundingClientRect();return {x:(event.clientX-b.left)/b.width*size,y:(event.clientY-b.top)/b.height*size}}
function topLetter(q){
 for(let index=letters.length-1;index>=0;index--){
  const {x,y,a}=pose(letters[index],index);
  const dx=q.x-x,dy=q.y-y;
  if(Math.abs(dx*Math.cos(a)+dy*Math.sin(a))<44&&Math.abs(-dx*Math.sin(a)+dy*Math.cos(a))<29)return letters[index];
 }
}
function lift(p){if(!p||selected)return;next.hidden=true;selected=p;letters=letters.filter(x=>x!==p);gesture=null;result.hidden=false;showExaminer();putBack.hidden=false;reveal.textContent='A sealed letter';status.textContent='You drew one. Click the envelope to open it.';draw.disabled=true;reset.hidden=false;render();examiner.focus()}
canvas.addEventListener('pointerdown',event=>{
 if(!event.isPrimary||event.button!==0)return;
 const q=point(event);gesture={id:event.pointerId,start:q,last:q,candidate:topLetter(q),letter:null,mode:'pending'};canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event=>{
 if(gesture?.id!==event.pointerId)return;
 const q=point(event),g=gesture,dx=q.x-g.last.x,dy=q.y-g.last.y;
 const total=Math.hypot(q.x-g.start.x,q.y-g.start.y);
 const startRadius=Math.hypot(g.start.x-center,g.start.y-center),nowRadius=Math.hypot(q.x-center,q.y-center);
 if(g.mode==='pending'&&total>8){
  // A quick outward sweep near the rim catches a letter. Curved or central motions stir.
  if(!selected&&g.candidate&&startRadius>77&&nowRadius-startRadius>total*.62){g.mode='pull';g.letter=g.candidate;status.textContent='Keep pulling the letter away from the pile.'}
  else {g.mode='stir';status.textContent='The letters are mixing. Tap one, or pull one away from the pile.'}
 }
 if(g.mode==='stir')mix(q.x,q.y,dx,dy);
 if(g.mode==='pull'){g.letter.x=q.x;g.letter.y=q.y;render();if(nowRadius>radius+23)lift(g.letter)}
 g.last=q;
});
function release(event){
 const g=gesture;if(g?.id!==event.pointerId)return;gesture=null;
 if(event.type==='pointerup'&&g.mode==='pending'&&g.candidate&&!selected){lift(g.candidate);return}
 if(g.letter){const dx=g.letter.x-center,dy=g.letter.y-center,d=Math.max(1,Math.hypot(dx,dy));const distance=Math.min(155,d);g.letter.x=center+dx/d*distance;g.letter.y=center+dy/d*distance;status.textContent='The letter slipped back into the pile.'}
 render();
}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
draw.onclick=()=>lift(letters.at(-1));
stir.onclick=()=>{for(const p of letters){const x=p.x-center,y=p.y-center;p.vx=-y*.075+rand(-7,7);p.vy=x*.075+rand(-7,7);p.va=rand(-.19,.19)}wake(1.8);status.textContent='The letters are mixing.'};
function openLetter(){
 if(!selected||opened)return;
 opened=true;rotation=null;orient(0,0);examiner.dataset.open='true';
 note.textContent=selected.answer;reveal.textContent=selected.answer;
 putBack.hidden=true;next.hidden=false;status.textContent='The seal is open.';
 examiner.querySelector('.view-hint').textContent='';
}
putBack.onclick=()=>{if(!selected)return;selected.x=rand(188,352);selected.y=rand(188,352);letters.push(selected);selected=null;draw.disabled=false;result.hidden=true;examiner.hidden=true;status.textContent='Back in the pile.';render();draw.focus()};
next.onclick=()=>{
 selected=null;
 if(!letters.length)refill();
 lift(letters.at(-1));
};
reset.onclick=()=>{refill();draw.focus()};
canvas.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();draw.click()}if(event.key===' '){event.preventDefault();stir.click()}});
function resize(){
 const pixels=Math.round(size*Math.min(devicePixelRatio||1,1.5));
 canvas.width=canvas.height=pileCache.width=pileCache.height=pixels;
 const scale=pixels/size;
 ctx.setTransform(scale,0,0,scale,0,0);
 pilePaint.setTransform(scale,0,0,scale,0,0);
 render();
}
resize();refill();
window.addEventListener('resize',resize);
if(!reduced){
 const animateHover=(now)=>{
  hoverFrame=0;
  const elapsed=lastHoverFrame?Math.min(now-lastHoverFrame,48):16;
  lastHoverFrame=now;
  if(frame||gesture){
   hoverTarget=null;
   hover.strength=0;
   lastHoverFrame=0;
   return;
  }
  if(hoverTarget){
   if(hover.strength<.02){hover.x=hoverTarget.x;hover.y=hoverTarget.y}
   const follow=1-Math.exp(-elapsed/53);
   hover.x+=(hoverTarget.x-hover.x)*follow;
   hover.y+=(hoverTarget.y-hover.y)*follow;
  }
  const ease=1-Math.exp(-elapsed/(hoverTarget?65:160));
  hover.strength+=((hoverTarget?1:0)-hover.strength)*ease;
  const settled=!hoverTarget&&hover.strength<.005;
  if(settled)hover.strength=0;
  render(true);
  if(settled)lastHoverFrame=0;
  else hoverFrame=requestAnimationFrame(animateHover);
 };
 canvas.addEventListener('pointermove',event=>{
  if(event.pointerType!=='mouse'||gesture||frame)return;
  hoverTarget=point(event);
  if(!hoverFrame)hoverFrame=requestAnimationFrame(animateHover);
 });
 canvas.addEventListener('pointerleave',()=>{hoverTarget=null});
}
</script>
</html>
